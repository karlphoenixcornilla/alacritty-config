"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:bg_dir)\
$directory\
[](fg:bg_dir bg:bg_git)\
$git_branch$git_status\
[](fg:bg_git bg:bg_lang)\
$nodejs$python$rust$golang$java$c$php$ruby\
[▶](fg:bg_dir)\
$fill\
$cmd_duration\
$line_break\
$character"""

add_newline = true

palette = "claude"

[palettes.claude]
bg_dir = "#D97757"
bg_git = "#6A9BCC"
bg_lang = "#141413"
fg_dark = "#141413"
fg_light = "#FAF9F5"
grey = "#B0AEA4"
green = "#788C5D"
red = "#CC785C"
yellow = "#D4A27F"

[directory]
style = "fg:fg_dark bg:bg_dir bold"
format = "[ 📁 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

[git_branch]
symbol = ""
style = "fg:fg_dark bg:bg_git bold"
format = "[ 🌿 $symbol $branch ]($style)"

[git_status]
style = "fg:fg_dark bg:bg_git"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "🚨"
ahead = "🚀${count}"
behind = "🐢${count}"
diverged = "🔀🚀${ahead_count}🐢${behind_count}"
untracked = "🌱${count}"
stashed = "📦${count}"
modified = "📝${count}"
staged = "✅${count}"
renamed = "📛${count}"
deleted = "🗑️${count}"

[nodejs]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[java]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[c]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[php]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[ruby]
symbol = ""
style = "fg:fg_light bg:bg_lang"
format = "[ $symbol $version ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 500
style = "fg:yellow"
format = "[ ⏱️ $duration ]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:yellow)"
